name: Swift

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3'
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: swift build -v -c release

      - name: Zip
        id: zip
        run: |
          TAG=${GITHUB_REF/refs\/tags\//}
          ZIP_NAME=itpl-${TAG}.zip
          ZIP_PATH=./${ZIP_NAME}
          echo ${TAG}
          echo ${ZIP_NAME}
          echo ${ZIP_PATH}
          zip -j ${ZIP_NAME} .build/release/itpl
          echo "name=name::${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "name=path::${ZIP_PATH}" >> $GITHUB_OUTPUT

      - name: Release - Create
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Release - Upload Asset
        id: upload-release-asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ steps.zip.outputs.path }}
          asset_name: ${{ steps.zip.outputs.name }}
          asset_content_type: application/zip
