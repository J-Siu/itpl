name: Swift

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: swift-actions/setup-swift@v3
        with:
          swift-version: '6.3'
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: swift build -v -c release

      - name: Zip
        id: zip
        run: |
          TAG="${GITHUB_REF/refs\/tags\//}"
          ZIP_NAME="itpl-${TAG}.zip"
          ZIP_PATH="./${ZIP_NAME}"
          echo "set:"
          set | sort
          echo
          echo "TAG=${TAG}"
          echo "ZIP_NAME=${ZIP_NAME}"
          echo "ZIP_PATH=${ZIP_PATH}"
          echo "ls: $(ls -l .build/release/itpl)"
          zip -j ${ZIP_NAME} .build/release/itpl
          echo "name=name::${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "name=path::${ZIP_PATH}" >> $GITHUB_OUTPUT

      - name: Release - Create
        id: create_release
        uses: shogo82148/actions-create-release@v1
        with:
          release_name: Release ${{ github.ref }}
          tag_name: ${{ github.ref }}

      - name: Release - Upload Asset
        id: upload-release-asset
        uses: shogo82148/actions-upload-release-asset@v1
        with:
          asset_content_type: application/zip
          asset_name: ${{ steps.zip.outputs.name }}
          asset_path: ${{ steps.zip.outputs.path }}
          upload_url: ${{ steps.create_release.outputs.upload_url }}

